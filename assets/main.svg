<svg fill="none" viewBox="0 0 600 320" width="600" height="320" xmlns="http://www.w3.org/2000/svg">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <style>
                * {
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box;
                    text-decoration: none;
                    list-style: none;
                }

                .body {
                    --bg: #111110;
                    --fg: #e8e4e0;
                    --muted: #6b6662;
                    --accent: #e8793a;
                    --border: #2a2826;

                    height: 320px;
                    width: 100%;
                    background: var(--bg);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    flex-direction: column;
                    gap: 28px;
                    position: relative;
                    overflow: hidden;
                }

                .body::before {
                    content: '';
                    position: absolute;
                    inset: 0;
                    background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(232, 121, 58, 0.06), transparent);
                }

                .name {
                    font-family: Georgia, 'Times New Roman', serif;
                    font-size: 4.2rem;
                    font-weight: 400;
                    font-style: italic;
                    color: var(--fg);
                    letter-spacing: -0.02em;
                    line-height: 1;
                    position: relative;
                    z-index: 1;
                    opacity: 0;
                    animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
                }

                .divider {
                    width: 36px;
                    height: 1px;
                    background: var(--border);
                    position: relative;
                    z-index: 1;
                    opacity: 0;
                    animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
                }

                .info {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    gap: 6px;
                    position: relative;
                    z-index: 1;
                    opacity: 0;
                    animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
                }

                .info span {
                    font-family: 'Courier New', monospace;
                    font-size: 11px;
                    font-weight: 400;
                    letter-spacing: 0.08em;
                    text-transform: lowercase;
                    color: var(--muted);
                }

                .info .accent {
                    color: var(--accent);
                }

                .links {
                    display: flex;
                    align-items: center;
                    gap: 16px;
                    position: relative;
                    z-index: 1;
                    opacity: 0;
                    animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.8s forwards;
                }

                .links span {
                    font-family: 'Courier New', monospace;
                    font-size: 11px;
                    color: var(--muted);
                    letter-spacing: 0.06em;
                }

                .dot {
                    width: 3px;
                    height: 3px;
                    border-radius: 50%;
                    background: var(--border);
                }

                @keyframes rise {
                    from {
                        opacity: 0;
                        transform: translateY(14px);
                    }
                    to {
                        opacity: 1;
                        transform: translateY(0);
                    }
                }

                @media (prefers-color-scheme: light) {
                    .body {
                        --bg: #f5f0eb;
                        --fg: #1a1a1a;
                        --muted: #8a8580;
                        --accent: #c4581a;
                        --border: #d6d0ca;
                    }

                    .body::before {
                        background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(196, 88, 26, 0.05), transparent);
                    }
                }

                @media (prefers-reduced-motion) {
                    .name, .divider, .info, .links {
                        animation: none;
                        opacity: 1;
                    }
                }
            </style>
            <div class="body">
                <div class="name">hashylog</div>
                <div class="divider"></div>
                <div class="info">
                    <span>game <span>&amp;</span> software developer</span>
                </div>
                <div class="links">
                    <span>github</span>
                    <div class="dot"></div>
                    <span>x</span>
                    <div class="dot"></div>
                    <span>linkedin</span>
                    <div class="dot"></div>
                    <span>discord</span>
                </div>
            </div>
        </div>
    </foreignObject>
</svg>
